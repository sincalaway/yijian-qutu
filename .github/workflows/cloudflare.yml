name: Deploy Web (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: yijian-qutu
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过"; echo "skip=1" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: 20
      - name: Fetch AI model (split ≤25MB) & runtime
        if: steps.chk.outputs.skip != '1'
        run: SPLIT_MODEL=1 bash scripts/fetch-ai.sh
      - name: Deploy
        if: steps.chk.outputs.skip != '1'
        run: |
          npx -y wrangler@4 pages project create "$PROJECT" --production-branch main || true
          npx -y wrangler@4 pages deploy www --project-name "$PROJECT" --branch main --commit-dirty=true

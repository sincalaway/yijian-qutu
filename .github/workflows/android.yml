name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME）

      - name: Install
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icon & splash
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Sync web code
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk yijian-qutu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yijian-qutu-apk
          path: yijian-qutu.apk

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: yijian-qutu.apk

      - name: Update "latest" release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          prerelease: true
          body: main 分支自动构建的最新 APK，下载后直接安装。
          files: yijian-qutu.apk
